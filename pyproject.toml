[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkdocs-blog-autotranslate"
version = "0.2.0"
description = "MkDocs plugin + CLI: detect and fill blog translation gaps between language trees via DeepL."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Aldo Fieuw" }]
keywords = ["mkdocs", "mkdocs-plugin", "translation", "deepl", "blog", "i18n"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: MkDocs",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "mkdocs>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."mkdocs.plugins"]
blog-autotranslate = "mkdocs_blog_autotranslate.plugin:BlogAutotranslatePlugin"

[project.scripts]
blog-autotranslate = "mkdocs_blog_autotranslate.cli:main"

[project.urls]
Homepage = "https://github.com/Aldo-f/mkdocs-blog-autotranslate"
Repository = "https://github.com/Aldo-f/mkdocs-blog-autotranslate"
Issues = "https://github.com/Aldo-f/mkdocs-blog-autotranslate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mkdocs_blog_autotranslate"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
