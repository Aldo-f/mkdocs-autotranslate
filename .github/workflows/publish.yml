name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC trusted publishing — no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  smoke-test:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from PyPI and verify entry points
        run: |
          sleep 20  # allow CDN propagation
          pip install mkdocs-blog-autotranslate
          python - <<'EOF'
          from mkdocs.plugins import get_plugins
          assert "blog-autotranslate" in get_plugins(), "plugin not registered"
          print("PyPI package installs and registers OK")
          EOF
          blog-autotranslate --help > /dev/null && echo "CLI OK"
